name: CI

on:
  push:
    branches: [ master, dev, '**' ]
  pull_request:
    branches: [ master, dev, ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-scripts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run PHPUnit
        run: php bin/phpunit